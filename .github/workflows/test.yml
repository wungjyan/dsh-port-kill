name: Test

# Runs the suite on every push and pull request, on all three platforms the
# plugin claims to support. The release workflow only publishes; nothing else
# exercised these tests, so a change could ship with a Windows-only regression
# that no job would have caught.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide what the other two say: the whole
      # point is to see which platform disagrees.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The suite reads no history, but a shallow clone keeps the Windows
          # checkout fast, and that is the leg most likely to time out.
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # A syntax error is the failure mode most likely to reach a user, and it
      # costs a second here.
      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test
